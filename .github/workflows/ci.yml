name: CI

"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

# Cancel in-progress jobs.
# For a pull request, "github.ref" is "refs/pull/NUMBER/merge", which is unique
# per pull request even when the pull request originates from a fork.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: ${{ github.workspace }}

jobs:

  # The JDK version doesn't matter, but these Docker images happen to use
  # different underlying OS versions.

  ubuntu_stable:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-ubuntu-jdk11-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
      - name: test.sh
        run: ./test.sh

  ubuntu_rolling:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-ubuntu-jdk25-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
      - name: test.sh
        run: ./test.sh

  rocky:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-rockylinux-jdk11-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
      - name: test.sh
        run: ./test.sh
