name: CI

"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

# Cancel in-progress jobs.
# For a pull request, "github.ref" is "refs/pull/NUMBER/merge", which is unique
# per pull request even when the pull request originates from a fork.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: ${{ github.workspace }}

jobs:

  # The JDK version doesn't matter, but these Docker images happen to use
  # different underlying OS versions.

  # These jobs run ./test.sh, which builds Fjalar, checks that command-line
  # options are documented, builds the documentation, and runs the Kvasir
  # regression tests.

  ubuntu_stable:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-ubuntu-jdk11-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
          # Nothing pushes, so do not leave a credential in the workspace while
          # building and running code from a pull request.
          persist-credentials: false
      - name: test.sh
        run: ./test.sh

  ubuntu_rolling:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-ubuntu-jdk25-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
          # Nothing pushes, so do not leave a credential in the workspace while
          # building and running code from a pull request.
          persist-credentials: false
      - name: test.sh
        run: ./test.sh

  rocky:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-rockylinux-jdk11-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
          # Nothing pushes, so do not leave a credential in the workspace while
          # building and running code from a pull request.
          persist-credentials: false
      - name: test.sh
        run: ./test.sh

  # These jobs run ./test-kvasir.sh, which runs Daikon's own scripts/test-kvasir.sh
  # against this repository.  That additionally runs the DynComp regression tests.

  kvasir_ubuntu_stable:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-ubuntu-jdk11-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
          # Nothing pushes, so do not leave a credential in the workspace while
          # building and running code from a pull request.
          persist-credentials: false
      - name: test-kvasir.sh
        run: ./test-kvasir.sh

  kvasir_ubuntu_rolling:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-ubuntu-jdk25-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
          # Nothing pushes, so do not leave a credential in the workspace while
          # building and running code from a pull request.
          persist-credentials: false
      - name: test-kvasir.sh
        run: ./test-kvasir.sh

  kvasir_rocky:
    runs-on: ubuntu-latest
    container:
      image: mdernst/daikon-rockylinux-jdk11-plus:latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: true
          fetch-depth: 25
          # Nothing pushes, so do not leave a credential in the workspace while
          # building and running code from a pull request.
          persist-credentials: false
      - name: test-kvasir.sh
        run: ./test-kvasir.sh
